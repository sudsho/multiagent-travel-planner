# production profile
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.2
  max_tokens: 1500

agents:
  research:
    enabled: true
  transport:
    enabled: true
  hotel:
    enabled: true
  attractions:
    enabled: true
  weather:
    enabled: true
  budget:
    enabled: true

graph:
  recursion_limit: 25
  parallel_fanout: true

cache:
  backend: redis
  ttl_seconds:
    weather: 3600
    flights: 1800
    hotels: 1800
    attractions: 86400

api:
  rate_limit_per_minute: 30
  request_timeout_seconds: 20
  cors_allow_origins: []  # set via CORS_ALLOW_ORIGINS env in deploy
  max_query_chars: 1200
  max_itinerary_days: 14

logging:
  level: INFO
  json: true
  request_id_header: x-request-id

retries:
  llm_max_retries: 3
  api_max_retries: 2
  backoff_base_seconds: 0.5

defaults:
  currency: USD
  pace: moderate
  party_size: 2
